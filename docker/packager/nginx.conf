worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    log_format main '$remote_addr "$request" $status $body_bytes_sent "$http_referer"';
    access_log /var/log/nginx/access.log main;

    server {
        listen 88;
        server_name _;

        # ── HLS packaging via nginx-vod-module (remote mode) ──────────────────
        # Player requests:
        #   /hls/p/102/sp/10200/serveFlavor/entryId/X/v/2/ev/2/flavorId/Y/name/a.mp4/index.m3u8
        # vod-module strips "/hls/" prefix + vod segment suffix, then makes an
        # internal subrequest to: vod_upstream_location + "/" + stripped_path
        #   → /kaltura_upstream/p/102/.../a.mp4
        # proxy_pass strips /kaltura_upstream and sends to Kaltura Apache:
        #   GET http://kaltura_app:80/p/102/.../a.mp4   (serveFlavor rewrite handles it)
        location /hls/ {
            vod hls;
            vod_mode remote;
            vod_upstream_location /kaltura_upstream;

            vod_hls_segment_file_name_prefix "seg";
            vod_segment_duration 10000;
            vod_align_segments_to_key_frames on;
            vod_max_mapping_response_size 1m;

            add_header Access-Control-Allow-Origin  '*' always;
            add_header Access-Control-Allow-Headers '*' always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Internal location for fetching raw mp4 from Kaltura Apache.
        # proxy_pass with trailing slash strips the /kaltura_upstream prefix.
        location /kaltura_upstream/ {
            internal;
            proxy_pass         http://kaltura_app:80/;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_buffering    off;
        }
    }
}
