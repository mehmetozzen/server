worker_processes auto;
# stderr, not a file in the container layer: an access/error log per HLS
# segment request fills the writable layer with nothing rotating it.
error_log /dev/stderr warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    access_log off;

    server {
        listen 88;
        server_name _;

        # ── HLS packaging via nginx-vod-module (remote mode) ──────────────────
        # Player requests:
        #   /hls/p/102/sp/10200/serveFlavor/entryId/X/v/2/ev/2/flavorId/Y/name/a.mp4/index.m3u8
        # vod-module strips "/hls/" prefix + vod segment suffix, then makes an
        # internal subrequest to: vod_upstream_location + "/" + stripped_path
        #   → /kaltura_upstream/p/102/.../a.mp4
        # proxy_pass strips /kaltura_upstream and sends to Kaltura Apache:
        #   GET http://kaltura_app:80/p/102/.../a.mp4   (serveFlavor rewrite handles it)
        location /hls/ {
            vod hls;
            vod_mode remote;
            vod_upstream_location /kaltura_upstream;
            vod_base_url $http_x_forwarded_proto://$http_host;

            vod_hls_segment_file_name_prefix "seg";
            vod_segment_duration 10000;
            vod_align_segments_to_key_frames on;
            vod_max_mapping_response_size 1m;

            add_header Access-Control-Allow-Origin  '*' always;
            add_header Access-Control-Allow-Headers '*' always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # ── DASH packaging — same pipeline, MPD/fMP4 output ───────────────────
        # Apache proxies /dash/ here and delivery profiles may reference it;
        # without this location every DASH request 404'd while the README
        # advertised HLS/DASH support.
        location /dash/ {
            vod dash;
            vod_mode remote;
            vod_upstream_location /kaltura_upstream;
            vod_base_url $http_x_forwarded_proto://$http_host;

            vod_segment_duration 10000;
            vod_align_segments_to_key_frames on;
            vod_max_mapping_response_size 1m;

            add_header Access-Control-Allow-Origin  '*' always;
            add_header Access-Control-Allow-Headers '*' always;
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Internal location for fetching raw mp4 from Kaltura Apache.
        # Uses HTTPS because port 80 issues a blanket 301 redirect when PROTOCOL=https.
        # The vod module sends the full URI including the /hls/ or /dash/ prefix
        # (e.g. /kaltura_upstream/hls/p/102/.../a.mp4), so we strip both
        # /kaltura_upstream/ and the packaging prefix before proxying upstream.
        location /kaltura_upstream/ {
            internal;
            rewrite ^/kaltura_upstream/(?:hls|dash)/(.*)$ /$1 break;
            rewrite ^/kaltura_upstream/(.*)$       /$1 break;
            # KNOWN LIMITATION: nginx resolves this hostname once, at config
            # load. Recreating the app container gives it a new IP and every
            # HLS/DASH request then fails with "connect() failed (111:
            # Connection refused)" until this container is restarted:
            #     docker compose ... restart packager
            # `make doctor` detects the condition explicitly.
            # The usual fix — resolver + hostname in a variable — was tried and
            # rejected: with a variable, proxy_pass no longer forwards the
            # rewritten URI that nginx-vod-module's subrequest depends on, and
            # every segment 404s. Making that work needs the prefix stripping
            # moved out of `rewrite` (the vod module requires a prefix location
            # for vod_upstream_location, so a regex capture is not a drop-in).
            # Left for the reproducibility pass rather than shipping a
            # half-working delivery path.
            proxy_pass            https://kaltura_app:443;
            proxy_ssl_verify      off;
            proxy_ssl_server_name on;
            proxy_ssl_name        $host;
            proxy_set_header      Host              $host;
            proxy_set_header      X-Real-IP         $remote_addr;
            proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_http_version    1.1;
            proxy_buffering       off;
        }
    }
}
