date.timezone = UTC
memory_limit = 512M
upload_max_filesize = 500M
post_max_size = 500M
max_execution_time = 600
max_input_time = 600

; APCu (replaces deprecated APC in PHP 8)
apc.enabled = 1
apc.shm_size = 128M
apc.ttl = 7200

; OPcache
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 60

; Error reporting (reduce noise in dev)
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
log_errors = On
error_log = /opt/kaltura/log/php_error.log

short_open_tag = On
