# /hlsm/ → the packager's /hls/ location.
#
# Kaltura's default VOD HLS delivery profile is "Simulive HLSM"
# (deployment/base/scripts/init_data/07.DeliveryProfileVodPackagerHlsManifest.ini:
# type 69, isDefault=1, url @VOD_PACKAGER_URL@/hlsm). playManifest therefore
# redirects every applehttp request to
#   /hlsm/p/<pid>/sp/<pid>00/serveFlavor/.../name/a.mp4/index.m3u8/master.m3u8
# The packager has no /hlsm/ location, and without this rule Apache hands the
# path to Kaltura, which answers with the raw mp4 — the V2 player's hls.js
# cannot parse it and playback never starts. The packager's /hls/ location
# already serves that exact URL shape (master + variant playlists), and the
# segment URLs it emits start with /hls/, which the vhost routes already.
#
# Server-level on purpose: mod_proxy merges these into every virtual host, so
# the rule lives outside the image and is bind-mounted by docker-compose.yml.
# ProxyPreserveHost and X-Forwarded-Proto come from the vhost's own media rules
# (docker/app/entrypoint.sh, emit_media_proxy).
ProxyPass        /hlsm/ http://packager:88/hls/
ProxyPassReverse /hlsm/ http://packager:88/hls/
