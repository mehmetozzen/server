# nginx-rtmp live media server for Kaltura CE.
# Ingest:   rtmp://<host>:1935/kLive/<stream>     (OBS / ffmpeg push)
# Playback: http://live-rtmp:8090/hlsme/<stream>.m3u8
#           — proxied by the Kaltura Apache at https://<host>/hlsme/ so the
#           player fetches it same-origin. A KMC "Manual Live Stream" entry
#           points its HLS URL there.
load_module /usr/lib/nginx/modules/ngx_rtmp_module.so;

worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 256;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # "kLive" mirrors Kaltura's application naming (kBroadcastUrlManager
        # default) so ingest URLs look like Kaltura cloud's.
        application kLive {
            live on;

            # A publisher whose connection dies without closing cleanly keeps
            # holding the stream name: nginx still counts it as publishing, so
            # the encoder's own reconnect is refused with "already publishing"
            # and the stream stays down for good. Neither ping nor ping_timeout
            # recovers it -- both need an RTMP reply the dead peer never sends.
            # Measured with the default config: six minutes after a publisher
            # stopped sending, the name was still held; on a live host an OBS
            # session sat locked out for over twenty minutes while the viewer
            # got 404s. Dropping a publisher that has delivered no audio or
            # video for 10s frees the name well inside OBS's reconnect backoff.
            drop_idle_publisher 10s;

            # Publish auth: encoders push ...:1935/kLive/<stream>?token=<LIVE_PUBLISH_TOKEN>
            # (?t= also accepted; native Kaltura-Live entries use their own
            # streamPassword instead). The analytics-receiver validates it;
            # non-2xx → publish refused. Fail-closed at BOTH layers: receiver
            # down = no publish, and the receiver denies when no secret is
            # configured (LIVE_ALLOW_ANON_PUBLISH=1 opts into open dev mode).
            # The ?cb= secret authenticates THIS container to the receiver so
            # nothing else on the compose network can drive live state.
            # NOTE: nginx resolves this hostname at config load — restart this
            # container if the receiver is recreated with a new IP.
            on_publish http://analytics-receiver:9999/live/publish?cb=@LIVE_CB_SECRET@;
            # Encoder disconnect → clear the entry's isLive flag (native lifecycle)
            on_publish_done http://analytics-receiver:9999/live/publish_done?cb=@LIVE_CB_SECRET@;

            # Single-bitrate passthrough → HLS segments. No transcoding here:
            # the encoder's output is segmented as-is (CPU-friendly). Multi-
            # bitrate needs an ffmpeg transcode step — out of scope for now.
            hls on;
            hls_path /var/tmp/hlsme;
            hls_fragment 4s;
            hls_playlist_length 60s;
            hls_cleanup on;

            # Record every stream; when the encoder disconnects the .flv closes
            # and the scheduler's upload cron ingests it as a VOD entry
            # ("<stream>-VOD ...") then deletes the file. Shared volume with
            # the scheduler container. record_max_size caps a single recording
            # so one endless (or hostile) stream cannot fill the volume.
            record all;
            record_path /opt/kaltura/live_recordings;
            record_suffix -%F-%H%M%S.flv;
            record_max_size 4096M;

            # Playback goes through HLS/Apache only; raw RTMP play is disabled.
            deny play all;
        }
    }
}

http {
    access_log off;

    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
    }

    server {
        listen 8090;

        location /hlsme/ {
            alias /var/tmp/hlsme/;
            # Live manifests must never be cached; CORS for direct-URL players.
            add_header Cache-Control no-cache always;
            add_header Access-Control-Allow-Origin @LIVE_CORS_ORIGIN@ always;
        }

        # ── Native Kaltura Live: Live Packager URL → flat nginx-rtmp HLS ─────────
        # playManifest for a source-32 entry emits the Kaltura Live Packager URL
        #   /dc-N/live/hls/p/<pid>/e/<entryId>/sd/<dur>/t/<token>/index-s<i>.m3u8
        # OBS publishes the stream as "<entryId>_<i>" (broadcast map
        # stream_name_template = {entryId}_%i), so the media playlist is
        # /var/tmp/hlsme/<entryId>_<i>.m3u8 and its segments <entryId>_<i>-<seq>.ts.
        # Apache proxies /dc-0/live/ here; these two rules bridge the path.
        location ~ ^/dc-\d+/live/hls/.*/e/(?<eid>[^/]+)/.*/index-s(?<sidx>\d+)\.m3u8$ {
            alias /var/tmp/hlsme/${eid}_${sidx}.m3u8;
            add_header Cache-Control no-cache always;
            add_header Access-Control-Allow-Origin @LIVE_CORS_ORIGIN@ always;
        }
        location ~ ^/dc-\d+/live/hls/.*/(?<seg>[^/]+\.ts)$ {
            alias /var/tmp/hlsme/$seg;
            add_header Access-Control-Allow-Origin @LIVE_CORS_ORIGIN@ always;
        }

        location = /health {
            return 200 "ok\n";
        }
    }
}
