# nginx-rtmp live media server for Kaltura CE.
# Ingest:   rtmp://<host>:1935/kLive/<stream>     (OBS / ffmpeg push)
# Playback: http://live-rtmp:8090/hlsme/<stream>.m3u8
#           — proxied by the Kaltura Apache at https://<host>/hlsme/ so the
#           player fetches it same-origin. A KMC "Manual Live Stream" entry
#           points its HLS URL there.
load_module /usr/lib/nginx/modules/ngx_rtmp_module.so;

worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 256;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # "kLive" mirrors Kaltura's application naming (kBroadcastUrlManager
        # default) so ingest URLs look like Kaltura cloud's.
        application kLive {
            live on;

            # Publish auth: encoders must push ...:1935/kLive/<stream>?token=<LIVE_PUBLISH_TOKEN>.
            # The analytics-receiver validates the token (env LIVE_PUBLISH_TOKEN);
            # non-2xx → publish refused. Fail-closed: receiver down = no publish.
            # NOTE: nginx resolves this hostname at config load — restart this
            # container if the receiver is recreated with a new IP.
            on_publish http://analytics-receiver:9999/live/publish;

            # Single-bitrate passthrough → HLS segments. No transcoding here:
            # the encoder's output is segmented as-is (CPU-friendly). Multi-
            # bitrate needs an ffmpeg transcode step — out of scope for now.
            hls on;
            hls_path /var/tmp/hlsme;
            hls_fragment 4s;
            hls_playlist_length 60s;
            hls_cleanup on;

            # Record every stream; when the encoder disconnects the .flv closes
            # and the scheduler's upload cron ingests it as a VOD entry
            # ("<stream>-VOD ...") then deletes the file. Shared volume with
            # the scheduler container.
            record all;
            record_path /opt/kaltura/live_recordings;
            record_suffix -%F-%H%M%S.flv;

            # Playback goes through HLS/Apache only; raw RTMP play is disabled.
            deny play all;
        }
    }
}

http {
    access_log off;

    server {
        listen 8090;

        location /hlsme/ {
            alias /var/tmp/hlsme/;
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            # Live manifests must never be cached; CORS for direct-URL players.
            add_header Cache-Control no-cache always;
            add_header Access-Control-Allow-Origin * always;
        }

        location = /health {
            return 200 "ok\n";
        }
    }
}
