# Usage: docker compose --env-file ./kaltura.conf up -d
services:
  mysql:
    image: mysql:5.7
    platform: linux/amd64
    container_name: kaltura_mysql
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/kaltura.cnf:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kaltura_root}
      MYSQL_DATABASE: kaltura
      MYSQL_USER: ${DB1_USER:-kaltura}
      MYSQL_PASSWORD: ${DB1_PASS:-kaltura123}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  memcache:
    image: memcached:1.6-alpine
    container_name: kaltura_memcache
    ports:
      - "11211:11211"

  sphinx:
    build:
      context: ..
      dockerfile: docker/sphinx/Dockerfile
    platform: linux/amd64
    container_name: kaltura_sphinx
    volumes:
      - ..:/opt/kaltura/app:ro
      - sphinx_data:/opt/sphinx
    ports:
      - "9312:9312"
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-P", "9312", "-e", "SHOW TABLES"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  kaltura:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: kaltura_app
    depends_on:
      mysql:
        condition: service_healthy
      sphinx:
        condition: service_healthy
      memcache:
        condition: service_started
      bundler:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ..:/opt/kaltura/app
      - kaltura_web:/opt/kaltura/web
      - kaltura_log:/opt/kaltura/log
      - kaltura_tmp:/opt/kaltura/tmp
      - ./certs:/opt/kaltura/certs:ro
    env_file: ./kaltura.conf
    environment:
      DB1_HOST: mysql
      DB1_PORT: "3306"
      DB1_NAME: kaltura

  packager:
    build:
      context: ..
      dockerfile: docker/packager/Dockerfile
    container_name: kaltura_packager
    depends_on:
      - kaltura
    ports:
      - "88:88"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  bundler:
    build:
      context: ..
      dockerfile: docker/bundler/Dockerfile
    container_name: kaltura_bundler
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Apache Druid (split-service) — KAVA analytics backend ────────────────────
  # Kaltura's kKavaReportsMgr POSTs native queries to the broker at /druid/v2/.
  # Each service runs via /druid.sh <role> (sh-based; the single-container
  # nano-quickstart path needs perl/supervise which the slim image lacks).
  druid-postgres:
    image: postgres:15-alpine
    platform: linux/amd64
    container_name: kaltura_druid_postgres
    environment:
      POSTGRES_USER: druid
      POSTGRES_PASSWORD: druid
      POSTGRES_DB: druid
    volumes:
      - druid_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U druid"]
      interval: 10s
      timeout: 5s
      retries: 10

  druid-zookeeper:
    image: zookeeper:3.8
    platform: linux/amd64
    container_name: kaltura_druid_zookeeper
    environment:
      ZOO_MY_ID: 1

  druid-coordinator:
    image: apache/druid:30.0.1
    platform: linux/amd64
    container_name: kaltura_druid_coordinator
    depends_on:
      druid-postgres:
        condition: service_healthy
      druid-zookeeper:
        condition: service_started
    env_file: ./druid/environment
    command: ["coordinator"]
    volumes:
      - druid_shared:/opt/shared
      - druid_coordinator_var:/opt/druid/var
    ports:
      - "8081:8081"   # coordinator + overlord (task submission)

  druid-broker:
    image: apache/druid:30.0.1
    platform: linux/amd64
    container_name: kaltura_druid_broker
    depends_on:
      druid-coordinator:
        condition: service_started
    env_file: ./druid/environment
    command: ["broker"]
    volumes:
      - druid_broker_var:/opt/druid/var
    ports:
      - "8082:8082"   # native /druid/v2/ queries — druid_url target
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/status/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s

  druid-historical:
    image: apache/druid:30.0.1
    platform: linux/amd64
    container_name: kaltura_druid_historical
    depends_on:
      druid-coordinator:
        condition: service_started
    env_file: ./druid/environment
    command: ["historical"]
    volumes:
      - druid_shared:/opt/shared
      - druid_historical_var:/opt/druid/var

  druid-middlemanager:
    image: apache/druid:30.0.1
    platform: linux/amd64
    container_name: kaltura_druid_middlemanager
    depends_on:
      druid-coordinator:
        condition: service_started
    env_file: ./druid/environment
    command: ["middleManager"]
    volumes:
      - druid_shared:/opt/shared
      - druid_middle_var:/opt/druid/var

  druid-router:
    image: apache/druid:30.0.1
    platform: linux/amd64
    container_name: kaltura_druid_router
    depends_on:
      druid-coordinator:
        condition: service_started
    env_file: ./druid/environment
    command: ["router"]
    volumes:
      - druid_router_var:/opt/druid/var
    ports:
      - "8888:8888"   # web console

  # ── Analytics event receiver — ingests player KAVA beacons into Druid ────────
  # Apache proxies /api_v3/index.php?service=analytics&action=trackEvent here.
  # Translates numeric KAVA eventType -> kKavaBase strings and batch-appends to
  # the player-events-historical Druid datasource. Replaces the SaaS Kanalony.
  analytics-receiver:
    build:
      context: ..
      dockerfile: docker/analytics-receiver/Dockerfile
    container_name: kaltura_analytics_receiver
    environment:
      DRUID_OVERLORD: http://druid-coordinator:8081
      FLUSH_INTERVAL_MS: "15000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  batch:
    build:
      context: ..
      dockerfile: docker/batch/Dockerfile
    container_name: kaltura_batch
    hostname: kaltura_batch
    depends_on:
      mysql:
        condition: service_healthy
      sphinx:
        condition: service_healthy
      memcache:
        condition: service_started
    volumes:
      - ..:/opt/kaltura/app
      - kaltura_web:/opt/kaltura/web
      - kaltura_log:/opt/kaltura/log
      - kaltura_tmp:/opt/kaltura/tmp
      - ./certs:/opt/kaltura/certs:ro
    env_file: ./kaltura.conf
    environment:
      DB1_HOST: mysql
      DB1_PORT: "3306"
      DB1_NAME: kaltura

volumes:
  mysql_data:
  kaltura_web:
  kaltura_log:
  kaltura_tmp:
  sphinx_data:
  druid_shared:
  druid_pgdata:
  druid_coordinator_var:
  druid_broker_var:
  druid_historical_var:
  druid_middle_var:
  druid_router_var:
