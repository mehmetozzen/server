# Usage: make -C docker up   (equivalent: docker compose --env-file ./kaltura.conf up -d)

# Applied to every service below via `<<: *common`.
#   restart  — a container that dies must come back. Without this a single
#              crash (or a host reboot) is a silent, permanent outage: the batch
#              worker died once at first boot on a test host and transcoding
#              stayed dead for 27 hours because nothing restarted it. Docker
#              backs off exponentially (100ms → ~1min cap), so a genuinely
#              broken container retries about once a minute instead of spinning.
#   logging  — the default json-file driver has NO size cap. Segment-serving
#              nginx and a restart loop both produce a lot of lines; without a
#              cap they fill the Docker graph directory.
# Every image below is pinned by DIGEST, not just by tag. A tag is a moving
# pointer: memcached:1.6-alpine, postgres:15-alpine and zookeeper:3.8 were all
# re-published under the same tag within weeks of this stack being built, and
# php:8.1-apache silently moved from a Debian bookworm base to trixie. Without
# digests, "same commit" does not mean "same stack" — an image rebuild months
# from now can behave differently with nothing in the repo to explain it.
#
# To update a pin deliberately:
#   docker buildx imagetools inspect <image>:<tag> | awk '/^Digest:/{print $2}'
# then replace the digest here and re-run `make -C docker build && make verify`.

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  mysql:
    <<: *common
    image: mysql:5.7@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    platform: linux/amd64
    container_name: kaltura_mysql
    networks: { default: { ipv4_address: 172.31.83.10 } }
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/kaltura.cnf:ro
    environment:
      # Fail-closed, same policy as the entrypoints: compose refuses to start
      # rather than initialising the database with a publicly-known password.
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?not set in docker/kaltura.conf — run make -C docker config}"
      MYSQL_DATABASE: kaltura
      MYSQL_USER: ${DB1_USER:-kaltura}
      MYSQL_PASSWORD: "${DB1_PASS:?not set in docker/kaltura.conf — run make -C docker config}"
    ports:
      - "127.0.0.1:3306:3306"   # host-only: containers reach MySQL via the `mysql` service name
    healthcheck:
      # -h 127.0.0.1 forces TCP. `-h localhost` uses the unix socket, which the
      # temporary server the image runs during first-time initialisation also
      # answers — marking the container healthy minutes before it accepts
      # network connections, so dependents start against a server that vanishes.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  memcache:
    <<: *common
    image: memcached:1.6-alpine@sha256:c29847751abb41f4c268c84fb3087fee05d4edcbda44409ccb5086e26148e8a7
    container_name: kaltura_memcache
    networks: { default: { ipv4_address: 172.31.83.11 } }
    ports:
      - "127.0.0.1:11211:11211"   # host-only: never expose memcached to the internet

  sphinx:
    <<: *common
    build:
      context: ..
      dockerfile: docker/sphinx/Dockerfile
    platform: linux/amd64
    container_name: kaltura_sphinx
    networks: { default: { ipv4_address: 172.31.83.12 } }
    volumes:
      - ..:/opt/kaltura/app:ro
      - sphinx_data:/opt/sphinx
    ports:
      - "127.0.0.1:9312:9312"   # host-only: Sphinx is reached via the `sphinx` service name
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-P", "9312", "-e", "SHOW TABLES"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  kaltura:
    <<: *common
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: kaltura_app
    networks: { default: { ipv4_address: 172.31.83.13 } }
    depends_on:
      mysql:
        condition: service_healthy
      sphinx:
        condition: service_healthy
      memcache:
        condition: service_started
      bundler:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ..:/opt/kaltura/app
      - kaltura_web:/opt/kaltura/web
      - kaltura_log:/opt/kaltura/log
      - kaltura_tmp:/opt/kaltura/tmp
      - ./certs:/opt/kaltura/certs:ro
    env_file: ./kaltura.conf
    environment:
      DB1_HOST: mysql
      DB1_PORT: "3306"
      DB1_NAME: kaltura
    healthcheck:
      # "Serving the API", not "process started". Tries HTTPS first, falls back
      # to HTTP so the check works in both PROTOCOL modes. start_period covers
      # the 3-5 minute first-boot initialisation, during which failures do not
      # count against retries.
      test: ["CMD-SHELL", "curl -skf 'https://localhost/api_v3/?service=system&action=ping' || curl -sf 'http://localhost/api_v3/?service=system&action=ping'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 420s

  packager:
    <<: *common
    build:
      context: ..
      dockerfile: docker/packager/Dockerfile
    container_name: kaltura_packager
    networks: { default: { ipv4_address: 172.31.83.16 } }
    depends_on:
      # service_healthy, not just "started": the packager proxies every segment
      # request upstream to Apache, so starting before the API serves produces
      # 502s with no signal that anything is wrong.
      kaltura:
        condition: service_healthy
    ports:
      - "127.0.0.1:88:88"   # host-only: players reach HLS/DASH via the Apache proxy (/hls/, /dash/)
    healthcheck:
      # `nginx -t` only parses the config file — it passes even when nginx is
      # dead, so a crashed packager reported healthy forever. Check that the
      # master process is alive AND the listener accepts connections.
      # Explicit `bash`: the image has no curl/wget and /bin/sh is dash, which
      # has no /dev/tcp.
      test: ["CMD", "bash", "-c", "pgrep -x nginx >/dev/null && exec 3<>/dev/tcp/127.0.0.1/88"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  bundler:
    <<: *common
    build:
      context: ..
      dockerfile: docker/bundler/Dockerfile
    container_name: kaltura_bundler
    networks: { default: { ipv4_address: 172.31.83.17 } }
    ports:
      - "127.0.0.1:8080:8080"   # host-only: the app reaches the bundler over the compose network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Apache Druid (split-service) — KAVA analytics backend ────────────────────
  # Kaltura's kKavaReportsMgr POSTs native queries to the broker at /druid/v2/.
  # Each service runs via /druid.sh <role> (sh-based; the single-container
  # nano-quickstart path needs perl/supervise which the slim image lacks).
  druid-postgres:
    <<: *common
    profiles: ["analytics"]
    image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    platform: linux/amd64
    container_name: kaltura_druid_postgres
    networks: { default: { ipv4_address: 172.31.83.30 } }
    environment:
      POSTGRES_USER: druid
      POSTGRES_PASSWORD: druid
      POSTGRES_DB: druid
    volumes:
      - druid_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U druid"]
      interval: 10s
      timeout: 5s
      retries: 10

  druid-zookeeper:
    <<: *common
    profiles: ["analytics"]
    image: zookeeper:3.8@sha256:b601a8c4403f16eefb4e21e1ab14ba1e723c0b2ae923303e4433afb385e8372e
    platform: linux/amd64
    container_name: kaltura_druid_zookeeper
    networks: { default: { ipv4_address: 172.31.83.31 } }
    environment:
      ZOO_MY_ID: 1

  druid-coordinator:
    <<: *common
    profiles: ["analytics"]
    image: apache/druid:30.0.1@sha256:ec80de69dcb752b6f366959c2afd96236f684d55c7199a92fef45420c0ad6e6d
    platform: linux/amd64
    container_name: kaltura_druid_coordinator
    networks: { default: { ipv4_address: 172.31.83.32 } }
    depends_on:
      druid-postgres:
        condition: service_healthy
      druid-zookeeper:
        condition: service_started
    env_file: ./druid/environment
    command: ["coordinator"]
    volumes:
      - druid_shared:/opt/shared
      - druid_coordinator_var:/opt/druid/var
    ports:
      - "127.0.0.1:8081:8081"   # host-only: overlord task submission must NEVER be public (RCE risk)

  druid-broker:
    <<: *common
    profiles: ["analytics"]
    image: apache/druid:30.0.1@sha256:ec80de69dcb752b6f366959c2afd96236f684d55c7199a92fef45420c0ad6e6d
    platform: linux/amd64
    container_name: kaltura_druid_broker
    networks: { default: { ipv4_address: 172.31.83.33 } }
    depends_on:
      druid-coordinator:
        condition: service_started
    env_file: ./druid/environment
    command: ["broker"]
    volumes:
      - druid_broker_var:/opt/druid/var
    ports:
      - "127.0.0.1:8082:8082"   # host-only: the app queries the broker via the `druid-broker` service name
    healthcheck:
      # The druid image ships no curl/wget; bash /dev/tcp checks the port.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s

  druid-historical:
    <<: *common
    profiles: ["analytics"]
    image: apache/druid:30.0.1@sha256:ec80de69dcb752b6f366959c2afd96236f684d55c7199a92fef45420c0ad6e6d
    platform: linux/amd64
    container_name: kaltura_druid_historical
    networks: { default: { ipv4_address: 172.31.83.34 } }
    depends_on:
      druid-coordinator:
        condition: service_started
    env_file: ./druid/environment
    command: ["historical"]
    volumes:
      - druid_shared:/opt/shared
      - druid_historical_var:/opt/druid/var

  druid-middlemanager:
    <<: *common
    profiles: ["analytics"]
    image: apache/druid:30.0.1@sha256:ec80de69dcb752b6f366959c2afd96236f684d55c7199a92fef45420c0ad6e6d
    platform: linux/amd64
    container_name: kaltura_druid_middlemanager
    networks: { default: { ipv4_address: 172.31.83.35 } }
    depends_on:
      druid-coordinator:
        condition: service_started
    env_file: ./druid/environment
    command: ["middleManager"]
    volumes:
      - druid_shared:/opt/shared
      - druid_middle_var:/opt/druid/var

  druid-router:
    <<: *common
    profiles: ["analytics"]
    image: apache/druid:30.0.1@sha256:ec80de69dcb752b6f366959c2afd96236f684d55c7199a92fef45420c0ad6e6d
    platform: linux/amd64
    container_name: kaltura_druid_router
    networks: { default: { ipv4_address: 172.31.83.36 } }
    depends_on:
      druid-coordinator:
        condition: service_started
    env_file: ./druid/environment
    command: ["router"]
    volumes:
      - druid_router_var:/opt/druid/var
    ports:
      - "127.0.0.1:8888:8888"   # host-only web console: reach it via SSH tunnel, never the public internet

  # ── Kafka (KRaft, single node) — analytics ingestion transport ──────────────
  # Both topics are consumed by Druid kafka supervisors, so Druid is Kafka's
  # ONLY consumer — running one without the other is meaningless. They share the
  # "analytics" profile for exactly that reason: enabling analytics brings up
  # Druid and Kafka together, and disabling it removes both (~4.2 GB RAM).
  # Streaming replaced the per-flush batch tasks that cost 736% CPU (now 41%).
  kafka:
    <<: *common
    image: apache/kafka:3.8.0@sha256:c89f315cff967322c5d2021434b32271393cb193aa7ec1d43e97341924e57069
    # Pinned like every other third-party image here: this digest is a manifest
    # list, and on Apple Silicon Docker picks the arm64 variant whose JDK 21
    # build dies instantly with SIGILL in System.registerNatives(). The rest of
    # the stack already runs amd64 under emulation, so Kafka must match — this
    # was the only service missing the pin.
    platform: linux/amd64
    container_name: kaltura_kafka
    networks: { default: { ipv4_address: 172.31.83.20 } }
    profiles: ["analytics"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: "24"   # realtime data is only read for hours
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Analytics event receiver — ingests player KAVA beacons into Druid ────────
  # Apache proxies /api_v3/index.php?service=analytics&action=trackEvent here.
  # Translates numeric KAVA eventType -> kKavaBase strings and batch-appends to
  # the player-events-historical Druid datasource. Replaces the SaaS Kanalony.
  analytics-receiver:
    <<: *common
    build:
      context: ..
      dockerfile: docker/analytics-receiver/Dockerfile
    container_name: kaltura_analytics_receiver
    networks: { default: { ipv4_address: 172.31.83.19 } }
    # Explicit env only — NOT env_file: this process parses unauthenticated
    # player beacons; it must not carry MYSQL_ROOT_PASSWORD or
    # ADMIN_CONSOLE_PASSWORD in its environment.
    environment:
      DRUID_OVERLORD: http://druid-coordinator:8081
      DRUID_BROKER: http://druid-broker:8082
      # Defaulted, not opt-in: the broker ships in the same profile, so the only
      # way it is absent is analytics being switched off entirely — and then
      # publishHistorical() degrades to the batch buffer on its own.
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      # Only the fallback batch path uses this — with KAFKA_BROKERS set the rows
      # stream through a supervisor instead. 15s produced one Druid index task
      # every 15 seconds, each a fresh JVM peon regardless of row count.
      FLUSH_INTERVAL_MS: "60000"
      # The analytics map reads country/region/city coordinates out of memcache
      # through cache.ini's geoCoordinates layer; this process is what writes
      # them. Unset would just leave the map unplotted.
      MEMCACHE_HOST: memcache
      DB1_HOST: mysql
      DB1_PORT: "3306"
      DB1_NAME: kaltura
      DB1_USER: ${DB1_USER:-kaltura}
      DB1_PASS: "${DB1_PASS:?not set in docker/kaltura.conf — run make -C docker config}"
      WWW_HOST: ${WWW_HOST:-localhost}
      LIVE_PUBLISH_TOKEN: ${LIVE_PUBLISH_TOKEN:-}
      LIVE_CB_SECRET: ${LIVE_CB_SECRET:-}
      LIVE_ALLOW_ANON_PUBLISH: ${LIVE_ALLOW_ANON_PUBLISH:-}
    depends_on:
      mysql:
        condition: service_healthy   # live orchestration needs the DB from the first on_publish
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Live media server (nginx-rtmp) ───────────────────────────────────────────
  # Kaltura's official FOSS live path: RTMP ingest on the kLive application,
  # HLS out at /hlsme/<stream>.m3u8 (proxied by Apache for same-origin playback).
  # A KMC "Manual Live Stream" entry consumes the HLS URL.
  # Publish auth (fail-closed): on_publish → analytics-receiver /live/publish.
  # Native entries validate the encoder's token against their streamPassword;
  # manual streams validate against LIVE_PUBLISH_TOKEN. With NO secret
  # configured, publishing is REFUSED — set LIVE_ALLOW_ANON_PUBLISH=1 only on
  # an isolated dev box.
  live-rtmp:
    <<: *common
    build:
      context: ..
      dockerfile: docker/live-rtmp/Dockerfile
    container_name: kaltura_live_rtmp
    networks: { default: { ipv4_address: 172.31.83.18 } }
    depends_on:
      analytics-receiver:
        condition: service_started   # on_publish auth callback target
    environment:
      LIVE_CB_SECRET: ${LIVE_CB_SECRET:-}      # must match the receiver's value
      LIVE_CORS_ORIGIN: ${LIVE_CORS_ORIGIN:-*} # site origin to block 3rd-party hotlinking
    ports:
      - "1935:1935"   # RTMP ingest — encoders (OBS/ffmpeg) connect here
    volumes:
      - live_recordings:/opt/kaltura/live_recordings
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 first
      # and nginx only listens on IPv4 — the container showed unhealthy forever.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  batch:
    <<: *common
    build:
      context: ..
      dockerfile: docker/batch/Dockerfile
    container_name: kaltura_batch
    networks: { default: { ipv4_address: 172.31.83.14 } }
    hostname: kaltura_batch
    depends_on:
      mysql:
        condition: service_healthy
      sphinx:
        condition: service_healthy
      memcache:
        condition: service_started
    volumes:
      - ..:/opt/kaltura/app
      - kaltura_web:/opt/kaltura/web
      - kaltura_log:/opt/kaltura/log
      - kaltura_tmp:/opt/kaltura/tmp
      - ./certs:/opt/kaltura/certs:ro
    env_file: ./kaltura.conf
    environment:
      DB1_HOST: mysql
      DB1_PORT: "3306"
      DB1_NAME: kaltura

  # ── Scheduler — the host-cron jobs of a bare-metal install ───────────────────
  # Containers have no host cron, so Kaltura's periodic maintenance
  # (configurations/cron/*.template + configurations/logrotate/*.template)
  # never ran: logs grew unbounded and old cache/content was never cleaned.
  # Reuses the batch image (same PHP runtime the official scripts need) with a
  # cron-running entrypoint.
  scheduler:
    <<: *common
    build:
      context: ..
      dockerfile: docker/batch/Dockerfile
    container_name: kaltura_scheduler
    networks: { default: { ipv4_address: 172.31.83.15 } }
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scheduler-entrypoint.sh"]
    volumes:
      - ..:/opt/kaltura/app
      - kaltura_web:/opt/kaltura/web
      - kaltura_log:/opt/kaltura/log
      - kaltura_tmp:/opt/kaltura/tmp
      - live_recordings:/opt/kaltura/live_recordings   # closed .flv recordings → VOD upload cron
      - ./scheduler/entrypoint.sh:/scheduler-entrypoint.sh:ro
    env_file: ./kaltura.conf
    environment:
      DB1_HOST: mysql
      DB1_PORT: "3306"
      DB1_NAME: kaltura
    healthcheck:
      test: ["CMD", "pgrep", "cron"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  kafka_data:
  live_recordings:
  mysql_data:
  kaltura_web:
  kaltura_log:
  kaltura_tmp:
  sphinx_data:
  druid_shared:
  druid_pgdata:
  druid_coordinator_var:
  druid_broker_var:
  druid_historical_var:
  druid_middle_var:
  druid_router_var:

# Fixed addresses, not Docker's start-order allocation. Apache's ProxyPass and
# nginx's proxy_pass / on_publish all bind the backend's ADDRESS when their
# config loads and never look it up again, so recreating a single service used
# to break the ones pointing at it: after a packager recreate every /hls/ and
# /dash/ request 502'd, and after an analytics-receiver recreate live publishing
# was refused — both silently, with DNS and HTTP working fine the whole time.
# Pinning the addresses removes the whole class of failure instead of patching
# each proxy directive separately.
#
# The subnet sits high in Docker's own 172.16-172.31 range, which it allocates
# upward from 172.17, so it is the least likely to be taken by another compose
# project. If it collides with something on the host, compose fails LOUDLY at
# `up` ("Pool overlaps with other one") — change the last three octets here and
# in the services above together.
networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: 172.31.83.0/24
