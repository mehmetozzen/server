services:
  mysql:
    image: mysql:5.7
    platform: linux/amd64
    container_name: kaltura_mysql
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/kaltura.cnf:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kaltura_root}
      MYSQL_DATABASE: kaltura
      MYSQL_USER: ${DB1_USER:-kaltura}
      MYSQL_PASSWORD: ${DB1_PASS:-kaltura123}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-kaltura_root}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  memcache:
    image: memcached:1.6-alpine
    container_name: kaltura_memcache
    ports:
      - "11211:11211"

  sphinx:
    build:
      context: ..
      dockerfile: docker/sphinx/Dockerfile
    platform: linux/amd64
    container_name: kaltura_sphinx
    volumes:
      - ..:/opt/kaltura/app:ro
      - sphinx_data:/opt/sphinx
    ports:
      - "9312:9312"
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-P", "9312", "-e", "SHOW TABLES"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  kaltura:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: kaltura_app
    depends_on:
      mysql:
        condition: service_healthy
      sphinx:
        condition: service_healthy
      memcache:
        condition: service_started
      bundler:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ..:/opt/kaltura/app
      - kaltura_web:/opt/kaltura/web
      - kaltura_log:/opt/kaltura/log
      - kaltura_tmp:/opt/kaltura/tmp
    environment:
      DB1_HOST: mysql
      DB1_PORT: "3306"
      DB1_NAME: kaltura
      DB1_USER: ${DB1_USER:-kaltura}
      DB1_PASS: ${DB1_PASS:-kaltura123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kaltura_root}
      SERVICE_URL: ${SERVICE_URL:-http://test.mehmetozen.test}
      WWW_HOST: ${WWW_HOST:-test.mehmetozen.test}
      ADMIN_CONSOLE_ADMIN_MAIL: ${ADMIN_CONSOLE_ADMIN_MAIL:-admin@kaltura.local}
      ADMIN_CONSOLE_PASSWORD: ${ADMIN_CONSOLE_PASSWORD:-Admin1234!}

  packager:
    build:
      context: ..
      dockerfile: docker/packager/Dockerfile
    container_name: kaltura_packager
    depends_on:
      - kaltura
    ports:
      - "88:88"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  bundler:
    build:
      context: ..
      dockerfile: docker/bundler/Dockerfile
    container_name: kaltura_bundler
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  batch:
    build:
      context: ..
      dockerfile: docker/batch/Dockerfile
    container_name: kaltura_batch
    hostname: kaltura_batch
    depends_on:
      mysql:
        condition: service_healthy
      sphinx:
        condition: service_healthy
      memcache:
        condition: service_started
    volumes:
      - ..:/opt/kaltura/app
      - kaltura_web:/opt/kaltura/web
      - kaltura_log:/opt/kaltura/log
      - kaltura_tmp:/opt/kaltura/tmp
    environment:
      DB1_HOST: mysql
      DB1_PORT: "3306"
      DB1_NAME: kaltura
      DB1_USER: ${DB1_USER:-kaltura}
      DB1_PASS: ${DB1_PASS:-kaltura123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kaltura_root}
      SERVICE_URL: ${SERVICE_URL:-http://test.mehmetozen.test}
      TIME_ZONE: UTC

volumes:
  mysql_data:
  kaltura_web:
  kaltura_log:
  kaltura_tmp:
  sphinx_data:
