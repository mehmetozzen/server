# Usage: docker compose --env-file ./kaltura.conf up -d
services:
  mysql:
    image: mysql:5.7
    platform: linux/amd64
    container_name: kaltura_mysql
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/kaltura.cnf:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-kaltura_root}
      MYSQL_DATABASE: kaltura
      MYSQL_USER: ${DB1_USER:-kaltura}
      MYSQL_PASSWORD: ${DB1_PASS:-kaltura123}
    ports:
      - "127.0.0.1:3306:3306"   # host-only: containers reach MySQL via the `mysql` service name
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  memcache:
    image: memcached:1.6-alpine
    container_name: kaltura_memcache
    ports:
      - "127.0.0.1:11211:11211"   # host-only: never expose memcached to the internet

  sphinx:
    build:
      context: ..
      dockerfile: docker/sphinx/Dockerfile
    platform: linux/amd64
    container_name: kaltura_sphinx
    volumes:
      - ..:/opt/kaltura/app:ro
      - sphinx_data:/opt/sphinx
    ports:
      - "127.0.0.1:9312:9312"   # host-only: Sphinx is reached via the `sphinx` service name
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-P", "9312", "-e", "SHOW TABLES"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  kaltura:
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: kaltura_app
    depends_on:
      mysql:
        condition: service_healthy
      sphinx:
        condition: service_healthy
      memcache:
        condition: service_started
      bundler:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ..:/opt/kaltura/app
      - kaltura_web:/opt/kaltura/web
      - kaltura_log:/opt/kaltura/log
      - kaltura_tmp:/opt/kaltura/tmp
      - ./certs:/opt/kaltura/certs:ro
    env_file: ./kaltura.conf
    environment:
      DB1_HOST: mysql
      DB1_PORT: "3306"
      DB1_NAME: kaltura

  packager:
    build:
      context: ..
      dockerfile: docker/packager/Dockerfile
    container_name: kaltura_packager
    depends_on:
      - kaltura
    ports:
      - "88:88"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  bundler:
    build:
      context: ..
      dockerfile: docker/bundler/Dockerfile
    container_name: kaltura_bundler
    ports:
      - "127.0.0.1:8080:8080"   # host-only: the app reaches the bundler over the compose network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Apache Druid (split-service) — KAVA analytics backend ────────────────────
  # Kaltura's kKavaReportsMgr POSTs native queries to the broker at /druid/v2/.
  # Each service runs via /druid.sh <role> (sh-based; the single-container
  # nano-quickstart path needs perl/supervise which the slim image lacks).
  druid-postgres:
    image: postgres:15-alpine
    platform: linux/amd64
    container_name: kaltura_druid_postgres
    environment:
      POSTGRES_USER: druid
      POSTGRES_PASSWORD: druid
      POSTGRES_DB: druid
    volumes:
      - druid_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U druid"]
      interval: 10s
      timeout: 5s
      retries: 10

  druid-zookeeper:
    image: zookeeper:3.8
    platform: linux/amd64
    container_name: kaltura_druid_zookeeper
    environment:
      ZOO_MY_ID: 1

  druid-coordinator:
    image: apache/druid:30.0.1
    platform: linux/amd64
    container_name: kaltura_druid_coordinator
    depends_on:
      druid-postgres:
        condition: service_healthy
      druid-zookeeper:
        condition: service_started
    env_file: ./druid/environment
    command: ["coordinator"]
    volumes:
      - druid_shared:/opt/shared
      - druid_coordinator_var:/opt/druid/var
    ports:
      - "127.0.0.1:8081:8081"   # host-only: overlord task submission must NEVER be public (RCE risk)

  druid-broker:
    image: apache/druid:30.0.1
    platform: linux/amd64
    container_name: kaltura_druid_broker
    depends_on:
      druid-coordinator:
        condition: service_started
    env_file: ./druid/environment
    command: ["broker"]
    volumes:
      - druid_broker_var:/opt/druid/var
    ports:
      - "127.0.0.1:8082:8082"   # host-only: the app queries the broker via the `druid-broker` service name
    healthcheck:
      # The druid image ships no curl/wget; bash /dev/tcp checks the port.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s

  druid-historical:
    image: apache/druid:30.0.1
    platform: linux/amd64
    container_name: kaltura_druid_historical
    depends_on:
      druid-coordinator:
        condition: service_started
    env_file: ./druid/environment
    command: ["historical"]
    volumes:
      - druid_shared:/opt/shared
      - druid_historical_var:/opt/druid/var

  druid-middlemanager:
    image: apache/druid:30.0.1
    platform: linux/amd64
    container_name: kaltura_druid_middlemanager
    depends_on:
      druid-coordinator:
        condition: service_started
    env_file: ./druid/environment
    command: ["middleManager"]
    volumes:
      - druid_shared:/opt/shared
      - druid_middle_var:/opt/druid/var

  druid-router:
    image: apache/druid:30.0.1
    platform: linux/amd64
    container_name: kaltura_druid_router
    depends_on:
      druid-coordinator:
        condition: service_started
    env_file: ./druid/environment
    command: ["router"]
    volumes:
      - druid_router_var:/opt/druid/var
    ports:
      - "127.0.0.1:8888:8888"   # host-only web console: reach it via SSH tunnel, never the public internet

  # ── Kafka (KRaft, single node) — Real-Time analytics streaming (OPT-IN) ─────
  # Feeds ONLY the Real-Time tab's live viewer stats (player-events-realtime).
  # Everything else — Audience/Engagement/Contributors/Usage and the live
  # "Broadcasting Now" list — works without it. Costs ~0.5-0.8 GB RAM (broker +
  # the Druid supervisor task), so it is gated behind the "realtime" profile and
  # does NOT start by default. To enable: set KAFKA_BROKERS=kafka:9092 (in
  # kaltura.conf) and run `docker compose --profile realtime up -d`.
  kafka:
    image: apache/kafka:3.8.0
    container_name: kaltura_kafka
    profiles: ["realtime"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: "24"   # realtime data is only read for hours
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Analytics event receiver — ingests player KAVA beacons into Druid ────────
  # Apache proxies /api_v3/index.php?service=analytics&action=trackEvent here.
  # Translates numeric KAVA eventType -> kKavaBase strings and batch-appends to
  # the player-events-historical Druid datasource. Replaces the SaaS Kanalony.
  analytics-receiver:
    build:
      context: ..
      dockerfile: docker/analytics-receiver/Dockerfile
    container_name: kaltura_analytics_receiver
    env_file: ./kaltura.conf      # DB1_USER / DB1_PASS for entry enrichment
    environment:
      DRUID_OVERLORD: http://druid-coordinator:8081
      DRUID_BROKER: http://druid-broker:8082
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}   # empty = Real-Time streaming OFF (opt-in; set to kafka:9092 to enable)
      FLUSH_INTERVAL_MS: "15000"
      DB1_HOST: mysql
      DB1_PORT: "3306"
      DB1_NAME: kaltura
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Live media server (nginx-rtmp) ───────────────────────────────────────────
  # Kaltura's official FOSS live path: RTMP ingest on the kLive application,
  # HLS out at /hlsme/<stream>.m3u8 (proxied by Apache for same-origin playback).
  # A KMC "Manual Live Stream" entry consumes the HLS URL.
  # NOTE: port 1935 has no publish auth yet — on production restrict it by
  # firewall to broadcaster IPs until the auto-provision hook (with token
  # validation) lands.
  live-rtmp:
    build:
      context: ..
      dockerfile: docker/live-rtmp/Dockerfile
    container_name: kaltura_live_rtmp
    depends_on:
      analytics-receiver:
        condition: service_started   # on_publish auth callback target
    ports:
      - "1935:1935"   # RTMP ingest — encoders (OBS/ffmpeg) connect here
    volumes:
      - live_recordings:/opt/kaltura/live_recordings
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  batch:
    build:
      context: ..
      dockerfile: docker/batch/Dockerfile
    container_name: kaltura_batch
    hostname: kaltura_batch
    depends_on:
      mysql:
        condition: service_healthy
      sphinx:
        condition: service_healthy
      memcache:
        condition: service_started
    volumes:
      - ..:/opt/kaltura/app
      - kaltura_web:/opt/kaltura/web
      - kaltura_log:/opt/kaltura/log
      - kaltura_tmp:/opt/kaltura/tmp
      - ./certs:/opt/kaltura/certs:ro
    env_file: ./kaltura.conf
    environment:
      DB1_HOST: mysql
      DB1_PORT: "3306"
      DB1_NAME: kaltura

  # ── Scheduler — the host-cron jobs of a bare-metal install ───────────────────
  # Containers have no host cron, so Kaltura's periodic maintenance
  # (configurations/cron/*.template + configurations/logrotate/*.template)
  # never ran: logs grew unbounded and old cache/content was never cleaned.
  # Reuses the batch image (same PHP runtime the official scripts need) with a
  # cron-running entrypoint.
  scheduler:
    build:
      context: ..
      dockerfile: docker/batch/Dockerfile
    container_name: kaltura_scheduler
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scheduler-entrypoint.sh"]
    volumes:
      - ..:/opt/kaltura/app
      - kaltura_web:/opt/kaltura/web
      - kaltura_log:/opt/kaltura/log
      - kaltura_tmp:/opt/kaltura/tmp
      - live_recordings:/opt/kaltura/live_recordings   # closed .flv recordings → VOD upload cron
      - ./scheduler/entrypoint.sh:/scheduler-entrypoint.sh:ro
    env_file: ./kaltura.conf
    environment:
      DB1_HOST: mysql
      DB1_PORT: "3306"
      DB1_NAME: kaltura
    healthcheck:
      test: ["CMD", "pgrep", "cron"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  kafka_data:
  live_recordings:
  mysql_data:
  kaltura_web:
  kaltura_log:
  kaltura_tmp:
  sphinx_data:
  druid_shared:
  druid_pgdata:
  druid_coordinator_var:
  druid_broker_var:
  druid_historical_var:
  druid_middle_var:
  druid_router_var:
